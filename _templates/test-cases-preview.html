<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Cases Preview</title>
  <!-- Self-contained: KHÔNG CDN cho CSS/layout (mở file:// offline vẫn đẹp). SheetJS chỉ nạp khi bấm Export. -->
  <!-- Data loaded từ sibling file. Re-run /test-cases để refresh data.js. -->
  <script src="data.js"></script>
  <style>
    :root {
      --accent: #4a6cf7;
      --accent-soft: #eef2ff;
      --bg: #f4f6fb;
      --panel: #ffffff;
      --ink: #1e2430;
      --ink-soft: #5a6373;
      --line: #e3e7ef;
      --line-strong: #cdd4e0;
      --p1: #e5484d; --p2: #f5820b; --p3: #eab308; --p4: #8a94a6;
      --ok: #17a06a; --muted: #9aa3b2;
      --shadow: 0 1px 2px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.06);
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #7d97ff; --accent-soft: #232b45;
        --bg: #0e1220; --panel: #161b2c; --ink: #e7ebf5; --ink-soft: #9aa3b8;
        --line: #262d42; --line-strong: #333c56;
        --p3: #d6a516; --muted: #667089;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      }
    }
    :root[data-theme="dark"] {
      --accent: #7d97ff; --accent-soft: #232b45;
      --bg: #0e1220; --panel: #161b2c; --ink: #e7ebf5; --ink-soft: #9aa3b8;
      --line: #262d42; --line-strong: #333c56;
      --p3: #d6a516; --muted: #667089;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
    :root[data-theme="light"] {
      --accent: #4a6cf7; --accent-soft: #eef2ff;
      --bg: #f4f6fb; --panel: #ffffff; --ink: #1e2430; --ink-soft: #5a6373;
      --line: #e3e7ef; --line-strong: #cdd4e0; --p3: #eab308; --muted: #9aa3b2;
      --shadow: 0 1px 2px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 20px 60px;
      font-family: 'Inter', 'Segoe UI', Tahoma, system-ui, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }

    /* Header */
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
    .meta { color: var(--ink-soft); font-size: 13px; }
    .theme-toggle {
      background: var(--panel); border: 1px solid var(--line); color: var(--ink-soft);
      border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 500;
    }
    .theme-toggle:hover { border-color: var(--line-strong); }

    /* Stat pills */
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .pill {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 14px; display: flex; flex-direction: column; gap: 1px; min-width: 74px;
      box-shadow: var(--shadow);
    }
    .pill .k { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
    .pill .v { font-size: 18px; font-weight: 700; }
    .pill.p1 .v { color: var(--p1); } .pill.p2 .v { color: var(--p2); }
    .pill.p3 .v { color: var(--p3); } .pill.p4 .v { color: var(--p4); }

    /* Toolbar */
    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
      padding: 12px; border-radius: var(--radius); margin-bottom: 18px;
    }
    .toolbar input, .toolbar select {
      padding: 8px 11px; border: 1px solid var(--line-strong); border-radius: 8px;
      font-size: 13px; background: var(--panel); color: var(--ink); font-family: inherit;
    }
    .toolbar input:focus, .toolbar select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .toolbar input[type="search"] { flex: 1; min-width: 200px; max-width: 320px; }
    .toolbar select { min-width: 130px; cursor: pointer; }
    .toolbar .spacer { flex: 1; }
    .prefix-group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
    .prefix-group input[type="text"] { width: 62px; }
    .btn {
      border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer;
      font-size: 13px; font-weight: 600; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-ok { background: var(--ok); color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--ink-soft); }
    .btn:hover { filter: brightness(1.05); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    /* Comment bar */
    .commentbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: var(--accent-soft); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 10px 14px; margin-bottom: 18px; font-size: 13px;
    }
    .commentbar .count { font-weight: 600; color: var(--accent); }
    .commentbar .spacer { flex: 1; }

    /* Cards */
    .cards { display: grid; gap: 14px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .card.has-comment { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
    .card-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; }
    .card-id {
      font-family: ui-monospace, SFMono-Regular, monospace; font-weight: 700; font-size: 14px;
      color: var(--accent); background: var(--accent-soft); border-radius: 7px; padding: 4px 9px; white-space: nowrap;
    }
    .card-main { flex: 1; min-width: 0; }
    .card-title { font-weight: 600; font-size: 15px; margin: 0 0 5px; }
    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-soft); }
    .tag { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
    .tag.ref { font-family: ui-monospace, monospace; }
    .card-actions { display: flex; gap: 6px; align-items: center; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff; }
    .badge-p1 { background: var(--p1); } .badge-p2 { background: var(--p2); }
    .badge-p3 { background: var(--p3); color: #3a2e00; } .badge-p4 { background: var(--p4); }
    .badge-auto-yes { background: var(--ok); color: #fff; }
    .badge-auto-no { background: var(--muted); color: #fff; }
    .badge-retired { background: var(--muted); color: #fff; }
    .cbtn {
      background: transparent; border: 1px solid var(--line-strong); border-radius: 8px;
      width: 34px; height: 34px; cursor: pointer; font-size: 15px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; color: var(--ink-soft);
    }
    .cbtn:hover { border-color: var(--accent); color: var(--accent); }
    .cbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .card-desc { padding: 0 16px 12px; color: var(--ink-soft); font-size: 13px; }
    .card-pre { padding: 0 16px 12px; font-size: 12.5px; color: var(--ink-soft); }
    .card-pre b { color: var(--ink); font-weight: 600; }

    /* Steps table */
    .steps { padding: 0 16px 16px; }
    table.steps-tbl { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; font-size: 13px; }
    .steps-tbl th { background: var(--bg); text-align: left; font-weight: 600; color: var(--ink-soft); padding: 8px 11px; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    .steps-tbl td { padding: 9px 11px; border-top: 1px solid var(--line); vertical-align: top; white-space: pre-wrap; }
    .steps-tbl td.snum { text-align: center; color: var(--muted); width: 44px; font-variant-numeric: tabular-nums; }
    .steps-tbl td.sdata { color: var(--ink-soft); }
    .steps-tbl tr:last-child td { border-bottom: none; }

    /* Comment editor */
    .comment-editor { padding: 0 16px 16px; }
    .comment-editor textarea {
      width: 100%; min-height: 68px; resize: vertical; padding: 10px 12px; font-size: 13px;
      border: 1px solid var(--accent); border-radius: 9px; background: var(--panel); color: var(--ink);
      font-family: inherit; line-height: 1.5;
    }
    .comment-editor textarea:focus { outline: 2px solid var(--accent-soft); }
    .comment-saved { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; margin: 0 16px 16px; background: var(--accent-soft); border-radius: 9px; font-size: 13px; }
    .comment-saved .txt { flex: 1; white-space: pre-wrap; }
    .comment-saved .lbl { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-style: italic; }

    /* View toggle segmented control */
    .viewseg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
    .viewseg button { background: var(--panel); border: none; color: var(--ink-soft); padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; display: inline-flex; align-items: center; gap: 5px; }
    .viewseg button + button { border-left: 1px solid var(--line-strong); }
    .viewseg button.active { background: var(--accent); color: #fff; }

    /* Table view */
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    table.tc-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .tc-table th, .tc-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: top; }
    .tc-table th { background: var(--bg); font-weight: 600; color: var(--ink-soft); position: sticky; top: 0; z-index: 2; white-space: nowrap; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    .tc-table tr.tc-first td { border-top: 2px solid var(--line-strong); }
    .tc-table tbody tr:hover td { background: var(--accent-soft); }
    .tc-table tr.has-comment td { background: var(--accent-soft); }
    .tc-table td.t-id { font-family: ui-monospace, SFMono-Regular, monospace; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .tc-table td.t-cmt { width: 44px; text-align: center; }
    .tc-table td.t-title { min-width: 200px; font-weight: 500; }
    .tc-table td.t-ref { font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
    .tc-table td.t-snum { text-align: center; color: var(--muted); width: 40px; font-variant-numeric: tabular-nums; }
    .tc-table td.t-action, .tc-table td.t-expected, .tc-table td.t-data { min-width: 200px; white-space: pre-wrap; }
    .tc-table td.t-data { color: var(--ink-soft); }
    .tc-table td.t-pre { min-width: 130px; font-size: 12px; color: var(--ink-soft); }
    .tc-table .t-saved { margin-top: 5px; font-size: 12px; color: var(--accent); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; white-space: pre-wrap; }
    .tc-table tr.t-editrow td { background: var(--accent-soft); padding: 0 12px 10px; }
    .tc-table tr.t-editrow textarea { width: 100%; min-height: 56px; resize: vertical; padding: 8px 10px; font-size: 13px; border: 1px solid var(--accent); border-radius: 8px; background: var(--panel); color: var(--ink); font-family: inherit; }
    .tc-table tr.t-editrow textarea:focus { outline: 2px solid var(--accent-soft); }
    .hidden { display: none !important; }

    /* Pagination */
    .pagination { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-top: 18px; color: var(--ink-soft); font-size: 13px; }
    .pagination-controls { display: flex; gap: 5px; }
    .pagination-controls button { background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); min-width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .pagination-controls button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pagination-controls button:disabled { opacity: .4; cursor: not-allowed; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: var(--panel); padding: 11px 20px; border-radius: 10px;
      font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all .25s; z-index: 99;
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Copy modal */
    .modal-bg { position: fixed; inset: 0; background: rgba(10,14,26,.55); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal-bg.show { display: flex; }
    .modal { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); width: 100%; max-width: 640px; max-height: 85vh; display: flex; flex-direction: column; }
    .modal h3 { margin: 0; padding: 16px 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
    .modal textarea { flex: 1; min-height: 60vh; margin: 0; border: none; padding: 14px 18px; font-family: ui-monospace, monospace; font-size: 12.5px; resize: vertical; background: var(--bg); color: var(--ink); line-height: 1.55; }
    .modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1 id="title">Test Cases</h1>
        <div class="meta" id="meta"></div>
      </div>
      <button class="theme-toggle" id="themeToggle">🌓 Theme</button>
    </header>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="🔍 Tìm test case...">
      <select id="filterFile"><option value="">Mọi file</option></select>
      <select id="filterCategory"><option value="">Mọi category</option></select>
      <select id="filterPriority">
        <option value="">Mọi priority</option>
        <option value="1">P1 — Critical</option>
        <option value="2">P2 — High</option>
        <option value="3">P3 — Medium</option>
        <option value="4">P4 — Low</option>
      </select>
      <select id="filterAuto">
        <option value="">Auto: All</option>
        <option value="Yes">Auto: Yes</option>
        <option value="No">Auto: No</option>
      </select>
      <select id="filterComment">
        <option value="">Comment: All</option>
        <option value="yes">Chỉ có comment</option>
        <option value="no">Chưa comment</option>
      </select>
      <span class="prefix-group">
        <label><input type="checkbox" id="prefixToggle" checked> prefix</label>
        <input type="text" id="idPrefix" value="TC">
      </span>
      <div class="spacer"></div>
      <div class="viewseg" id="viewSeg">
        <button data-view="card" class="active">▤ Card</button>
        <button data-view="table">▦ Bảng</button>
      </div>
      <select id="pageSize">
        <option value="15" selected>15 / trang</option>
        <option value="30">30 / trang</option>
        <option value="60">60 / trang</option>
        <option value="9999">Tất cả</option>
      </select>
      <button class="btn btn-ok" id="exportXlsx">📥 Excel</button>
      <button class="btn btn-ghost" id="exportXlsxMerged">Excel (gộp)</button>
    </div>

    <div class="commentbar">
      💬 <span class="count" id="commentCount">0</span> comment đang lưu (trong trình duyệt, không đụng file).
      <div class="spacer"></div>
      <button class="btn btn-accent" id="copyComments">📋 Copy toàn bộ comment</button>
      <button class="btn btn-ghost" id="clearComments">🗑 Xoá hết</button>
    </div>

    <div class="cards" id="cards"></div>
    <div class="table-wrap hidden" id="tableWrap">
      <table class="tc-table">
        <thead>
          <tr>
            <th class="t-cmt">💬</th>
            <th>ID</th>
            <th>Title</th>
            <th>Ref</th>
            <th>P</th>
            <th>Auto</th>
            <th>Preconditions</th>
            <th>#</th>
            <th>Action</th>
            <th>Expected</th>
            <th>Test Data</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="pagination">
      <div id="pageInfo">Trang 1 / 1</div>
      <div class="pagination-controls" id="pageControls"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-bg" id="copyModal">
    <div class="modal">
      <h3>📋 Comment để gửi vào chat</h3>
      <textarea id="copyText" readonly></textarea>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="copyClose">Đóng</button>
        <button class="btn btn-accent" id="copyDo">Copy vào clipboard</button>
      </div>
    </div>
  </div>

  <script>
    const FEATURE = window.FEATURE || "(unknown)";
    const UPDATED = window.UPDATED || "(unknown)";
    const LANG    = window.LANG    || "vi";
    const TESTCASES_DATA = window.TESTCASES_DATA || [];

    if (!window.TESTCASES_DATA) {
      document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#e5484d;"><h2>⚠️ Không load được data.js</h2><p>Chạy lại <code>/test-cases &lt;feature&gt;</code> để regen data.js cạnh file HTML này.</p></div>';
      throw new Error('TESTCASES_DATA missing');
    }

    const ALL_TCS = TESTCASES_DATA.flatMap(grp =>
      grp.testcases.map(tc => ({ ...tc, file: grp.file, scope: grp.scope, target: grp.target }))
    );

    // ---- Comment store (localStorage, keyed per feature) ----
    const CKEY = `tc-comments::${FEATURE}`;
    let comments = {};
    try { comments = JSON.parse(localStorage.getItem(CKEY) || '{}'); } catch (e) { comments = {}; }
    function saveComments() { localStorage.setItem(CKEY, JSON.stringify(comments)); }
    // Anchor comment theo CHK-ID (khóa BỀN 1:1) — KHÔNG theo stt (stt renumber mỗi lần regen).
    // Fallback stt chỉ khi TC mồ côi không có checklist link.
    function commentKey(tc) { return `${tc.file}#${tc.checklist || ('TC' + tc.stt)}`; }

    let filtered = [...ALL_TCS];
    let currentPage = 1;
    let pageSize = 15;
    let idPrefix = "TC";
    let usePrefix = true;
    let openEditors = new Set(); // keys of TCs whose editor is open
    let view = localStorage.getItem('tc-view') === 'table' ? 'table' : 'card';

    document.getElementById('title').textContent = `Test Cases — ${FEATURE}`;
    document.getElementById('meta').textContent = `Cập nhật: ${UPDATED} • ${TESTCASES_DATA.length} file • ${ALL_TCS.length} test case • ${ALL_TCS.reduce((a,t)=>a+t.steps.length,0)} bước`;

    // ---- Theme ----
    (function initTheme(){
      // Mặc định LIGHT (không theo prefers-color-scheme của OS); user tự đổi thì nhớ lựa chọn.
      const saved = localStorage.getItem('tc-theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('themeToggle').onclick = () => {
        const cur = document.documentElement.getAttribute('data-theme')
          || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('tc-theme', next);
      };
    })();

    function uniqueSorted(arr) { return [...new Set(arr.filter(Boolean))].sort(); }
    const files = uniqueSorted(TESTCASES_DATA.map(g => g.file));
    const cats = uniqueSorted(ALL_TCS.map(t => t.category));
    files.forEach(f => document.getElementById('filterFile').insertAdjacentHTML('beforeend', `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`));
    cats.forEach(c => document.getElementById('filterCategory').insertAdjacentHTML('beforeend', `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`));

    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtRef(ref) { return Array.isArray(ref) ? (ref.length ? ref.join(', ') : '—') : (ref || '—'); }
    function displayId(tc) { return usePrefix ? `${idPrefix}${tc.stt}` : tc.stt; }

    function applyFilters() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const fFile = document.getElementById('filterFile').value;
      const fCat = document.getElementById('filterCategory').value;
      const fPrio = document.getElementById('filterPriority').value;
      const fAuto = document.getElementById('filterAuto').value;
      const fCmt = document.getElementById('filterComment').value;

      filtered = ALL_TCS.filter(tc => {
        if (fFile && tc.file !== fFile) return false;
        if (fCat && tc.category !== fCat) return false;
        if (fPrio && String(tc.priority) !== fPrio) return false;
        if (fAuto && tc.auto !== fAuto) return false;
        if (fCmt === 'yes' && !comments[commentKey(tc)]) return false;
        if (fCmt === 'no' && comments[commentKey(tc)]) return false;
        if (q) {
          const hay = `${displayId(tc)} ${tc.title} ${tc.description} ${tc.checklist} ${tc.category} ${tc.subcategory} ${tc.steps.map(s=>s.action+' '+s.expected+' '+s.testData).join(' ')}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      currentPage = 1;
      render();
    }

    function render() {
      const cardHost = document.getElementById('cards');
      const tableWrap = document.getElementById('tableWrap');
      const start = (currentPage - 1) * pageSize;
      const rows = filtered.slice(start, start + pageSize);

      // Show/hide the two containers by current view
      cardHost.classList.toggle('hidden', view !== 'card');
      tableWrap.classList.toggle('hidden', view !== 'table');
      document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('active', b.getAttribute('data-view') === view));

      if (view === 'card') {
        cardHost.innerHTML = rows.length === 0
          ? `<div class="empty">Không có test case nào khớp filter.</div>`
          : rows.map(tc => cardHtml(tc)).join('');
      } else {
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = rows.length === 0
          ? `<tr><td colspan="11" class="empty">Không có test case nào khớp filter.</td></tr>`
          : rows.map(tc => tableRowsHtml(tc)).join('');
      }
      wireComments();
      updateStats();
      updatePagination();
      updateCommentCount();
    }

    // ---- Table view: 1 TC = N step rows (rowspan on TC-level cells) + optional editor row ----
    function tableRowsHtml(tc) {
      const key = commentKey(tc);
      const id = displayId(tc);
      const hasCmt = !!comments[key];
      const open = openEditors.has(key);
      const steps = tc.steps.length ? tc.steps : [{step:'',action:'',expected:'',testData:''}];
      const savedBlock = (hasCmt && !open) ? `<div class="t-saved">💬 ${escapeHtml(comments[key])}</div>` : '';
      const rowClass = hasCmt ? 'has-comment' : '';
      const stepRows = steps.map((s, idx) => {
        const first = idx === 0;
        const lead = first ? `
          <td class="t-cmt" rowspan="${steps.length}"><button class="cbtn ${open || hasCmt ? 'active' : ''}" data-cmt="${escapeHtml(key)}" title="Comment case này">💬</button></td>
          <td class="t-id" rowspan="${steps.length}">${escapeHtml(id)}${tc.retired ? ' <span class="badge badge-retired">retired</span>' : ''}</td>
          <td class="t-title" rowspan="${steps.length}">${escapeHtml(tc.title)}${savedBlock}</td>
          <td class="t-ref" rowspan="${steps.length}">${escapeHtml(fmtRef(tc.ref))}</td>
          <td rowspan="${steps.length}"><span class="badge badge-p${tc.priority}">P${tc.priority}</span></td>
          <td rowspan="${steps.length}"><span class="badge badge-auto-${(tc.auto||'no').toLowerCase()}">${escapeHtml(tc.auto || 'No')}</span></td>
          <td class="t-pre" rowspan="${steps.length}">${escapeHtml(tc.preconditions || '—')}</td>` : '';
        return `<tr class="${first ? 'tc-first ' : ''}${rowClass}">
          ${lead}
          <td class="t-snum">${escapeHtml(s.step)}</td>
          <td class="t-action">${escapeHtml(s.action)}</td>
          <td class="t-expected">${escapeHtml(s.expected)}</td>
          <td class="t-data">${escapeHtml(s.testData || '—')}</td>
        </tr>`;
      }).join('');
      const editorRow = open ? `
        <tr class="t-editrow" data-editor="${escapeHtml(key)}">
          <td colspan="11"><textarea placeholder="Ghi chú / góp ý cho case này...">${escapeHtml(comments[key] || '')}</textarea></td>
        </tr>` : '';
      return stepRows + editorRow;
    }

    function cardHtml(tc) {
      const key = commentKey(tc);
      const id = displayId(tc);
      const hasCmt = !!comments[key];
      const steps = tc.steps.length ? tc.steps : [{step:'',action:'',expected:'',testData:''}];
      const stepsHtml = steps.map(s => `
        <tr>
          <td class="snum">${escapeHtml(s.step)}</td>
          <td>${escapeHtml(s.action)}</td>
          <td>${escapeHtml(s.expected)}</td>
          <td class="sdata">${escapeHtml(s.testData || '—')}</td>
        </tr>`).join('');
      const tags = [
        tc.checklist ? `<span class="tag">${escapeHtml(tc.checklist)}</span>` : '',
        `<span class="tag ref">${escapeHtml(fmtRef(tc.ref))}</span>`,
        tc.category ? `<span class="tag">${escapeHtml(tc.category)}${tc.subcategory ? ' · ' + escapeHtml(tc.subcategory) : ''}</span>` : '',
      ].filter(Boolean).join('');
      const editorHtml = openEditors.has(key) ? `
        <div class="comment-editor" data-editor="${escapeHtml(key)}">
          <textarea placeholder="Ghi chú / góp ý cho case này...">${escapeHtml(comments[key] || '')}</textarea>
        </div>` : (hasCmt ? `
        <div class="comment-saved">
          <div style="flex:1"><div class="lbl">💬 Comment</div><div class="txt">${escapeHtml(comments[key])}</div></div>
        </div>` : '');
      return `
      <div class="card ${hasCmt ? 'has-comment' : ''}" data-key="${escapeHtml(key)}">
        <div class="card-head">
          <span class="card-id">${escapeHtml(id)}</span>
          <div class="card-main">
            <p class="card-title">${escapeHtml(tc.title)}${tc.retired ? ' <span class="badge badge-retired">retired</span>' : ''}</p>
            <div class="card-tags">
              <span class="badge badge-p${tc.priority}">P${tc.priority}</span>
              <span class="badge badge-auto-${(tc.auto||'no').toLowerCase()}">${escapeHtml(tc.auto || 'No')}</span>
              ${tags}
            </div>
          </div>
          <div class="card-actions">
            <button class="cbtn ${openEditors.has(key) || hasCmt ? 'active' : ''}" data-cmt="${escapeHtml(key)}" title="Comment case này">💬</button>
          </div>
        </div>
        ${tc.description ? `<div class="card-desc">${escapeHtml(tc.description)}</div>` : ''}
        ${tc.preconditions && tc.preconditions !== '—' ? `<div class="card-pre"><b>Preconditions:</b> ${escapeHtml(tc.preconditions)}</div>` : ''}
        <div class="steps">
          <table class="steps-tbl">
            <thead><tr><th class="snum">#</th><th>Action</th><th>Expected</th><th>Test Data</th></tr></thead>
            <tbody>${stepsHtml}</tbody>
          </table>
        </div>
        ${editorHtml}
      </div>`;
    }

    // Shared comment wiring — works for both card view (div[data-editor]) and table view (tr[data-editor]).
    // Dùng mousedown (fire TRƯỚC blur của textarea đang mở) để click 💬 không bị "nuốt" 1 lần.
    function wireComments() {
      document.querySelectorAll('[data-cmt]').forEach(btn => {
        btn.onmousedown = (e) => {
          e.preventDefault(); // giữ nguyên, chặn blur/focus mặc định nuốt cú click đầu
          const key = btn.getAttribute('data-cmt');
          if (openEditors.has(key)) openEditors.delete(key); else openEditors.add(key);
          render();
          if (openEditors.has(key)) {
            const ta = document.querySelector(`[data-editor="${cssEsc(key)}"] textarea`);
            if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
          }
        };
      });
      document.querySelectorAll('[data-editor] textarea').forEach(ta => {
        const key = ta.closest('[data-editor]').getAttribute('data-editor');
        ta.oninput = () => {
          const v = ta.value.trim();
          if (v) comments[key] = v; else delete comments[key];
          saveComments();
          updateCommentCount();
          const card = ta.closest('.card');
          if (card) card.classList.toggle('has-comment', !!v);
        };
        // Không đóng editor khi blur: nhiều testcase có thể cùng mở để người dùng
        // đối chiếu và nhập comment liên tiếp. Chỉ nút 💬 của chính testcase mới toggle editor.
      });
    }
    function cssEsc(s){ return String(s).replace(/["\\]/g, '\\$&'); }

    function updateStats() {
      const byP = [1,2,3,4].map(p => filtered.filter(t => t.priority === p).length);
      const autoY = filtered.filter(t => t.auto === 'Yes').length;
      const autoN = filtered.filter(t => t.auto === 'No').length;
      const steps = filtered.reduce((a,t)=>a+t.steps.length,0);
      document.getElementById('stats').innerHTML = `
        <div class="pill"><span class="k">Test case</span><span class="v">${filtered.length}<span style="font-size:12px;color:var(--ink-soft);font-weight:500"> / ${ALL_TCS.length}</span></span></div>
        <div class="pill"><span class="k">Bước</span><span class="v">${steps}</span></div>
        <div class="pill p1"><span class="k">P1</span><span class="v">${byP[0]}</span></div>
        <div class="pill p2"><span class="k">P2</span><span class="v">${byP[1]}</span></div>
        <div class="pill p3"><span class="k">P3</span><span class="v">${byP[2]}</span></div>
        <div class="pill p4"><span class="k">P4</span><span class="v">${byP[3]}</span></div>
        <div class="pill"><span class="k">Auto Y / N</span><span class="v" style="color:var(--ok)">${autoY}<span style="color:var(--ink-soft)"> / ${autoN}</span></span></div>`;
    }

    function updateCommentCount() {
      document.getElementById('commentCount').textContent = Object.keys(comments).length;
    }

    function updatePagination() {
      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      const ctrls = document.getElementById('pageControls');
      ctrls.innerHTML = '';
      const mk = (label, enabled, onClick, active) => {
        const b = document.createElement('button');
        b.innerHTML = label; b.disabled = !enabled;
        if (active) b.classList.add('active');
        if (onClick) b.onclick = onClick;
        ctrls.appendChild(b);
      };
      mk('←', currentPage > 1, () => { currentPage--; render(); window.scrollTo(0,0); });
      const maxShow = 5;
      let start = Math.max(1, currentPage - 2);
      let end = Math.min(totalPages, start + maxShow - 1);
      if (end - start + 1 < maxShow) start = Math.max(1, end - maxShow + 1);
      for (let i = start; i <= end; i++) mk(String(i), true, () => { currentPage = i; render(); window.scrollTo(0,0); }, i === currentPage);
      mk('→', currentPage < totalPages, () => { currentPage++; render(); window.scrollTo(0,0); });
      document.getElementById('pageInfo').textContent = `Trang ${currentPage} / ${totalPages} • ${filtered.length} TC`;
    }

    // ---- Copy comments ----
    // Sinh block feedback tự-hành: [A] preamble hướng dẫn AI + [B] header định danh + [C] N dòng neo CHK-ID.
    function buildCommentText() {
      const today = new Date().toISOString().slice(0,10);
      const preamble = [
        `[HƯỚNG DẪN CHO AI — feedback thu từ preview để cập nhật CHECKLIST/TESTCASE, KHÔNG phải yêu cầu mới]`,
        ``,
        `Nhiệm vụ: áp feedback dưới đây vào tài liệu nguồn của feature ${FEATURE}.`,
        `1. Sửa file .md trong docs/${FEATURE}/test/testcases/ — định vị case bằng CHK-ID bền (KHÔNG theo TC{stt}).`,
        `   TUYỆT ĐỐI KHÔNG sửa preview.html/data.js tay — data.js do /test-cases tự regen từ .md.`,
        `2. Phân loại MỖI feedback rồi REPORT bảng cho user xem TRƯỚC, KHÔNG auto-apply:`,
        `   (A) apply thẳng (wording/priority/auto 1 case) · (B) đổi số case → route /test-checklist trước (giữ 1:1)`,
        `   (C) LỆCH nghiệp vụ (mâu thuẫn ref FR/BR/NFR/Error Matrix) → mở docs/${FEATURE}/srs/${FEATURE}-spec.md`,
        `       tại ref đó, CẢNH BÁO + trích điều khoản + route /cr, KHÔNG tự sửa · (D) vượt phạm vi → route skill khác`,
        `   (E) mơ hồ → hỏi lại · (F) CHK không tồn tại/retired/stale → bỏ qua, nêu lý do.`,
        `3. Ghi file qua approval gate: L1 plan + L2 diff. Không ghi thẳng.`,
        `4. Xong nhắc user chạy lại /test-cases để regen data.js + preview.`,
        ``,
        `Feedback:`,
        ``,
        `### FEEDBACK-PREVIEW · testcase · feature=${FEATURE} · ${today} · updated=${UPDATED}`,
        `# Nguồn: docs/${FEATURE}/test/testcases/`,
        `# Mỗi dòng: - [CHK-ID · TC{stt} | ref=<FR/BR> | file=<md>] "<trích>" → <comment>`,
        ``,
      ];
      const lines = [];
      const seen = new Set();
      [...filtered, ...ALL_TCS].forEach(tc => {
        const key = commentKey(tc);
        if (seen.has(key) || !comments[key]) return;
        seen.add(key);
        const anchor = tc.checklist ? `${tc.checklist} · ${displayId(tc)}` : `${displayId(tc)}@${tc.file}`;
        const meta = [`ref=${fmtRef(tc.ref)}`, `file=${tc.file}`].join(' | ');
        const excerpt = (tc.title || '').slice(0, 70) + ((tc.title||'').length > 70 ? '…' : '');
        lines.push(`- [${anchor} | ${meta}] "${excerpt}" → ${comments[key]}`);
      });
      if (lines.length === 0) return '(chưa có comment nào)';
      return preamble.join('\n') + lines.join('\n');
    }
    document.getElementById('copyComments').onclick = () => {
      if (Object.keys(comments).length === 0) { toast('Chưa có comment nào'); return; }
      document.getElementById('copyText').value = buildCommentText();
      document.getElementById('copyModal').classList.add('show');
    };
    document.getElementById('copyClose').onclick = () => document.getElementById('copyModal').classList.remove('show');
    document.getElementById('copyModal').onclick = (e) => { if (e.target.id === 'copyModal') document.getElementById('copyModal').classList.remove('show'); };
    document.getElementById('copyDo').onclick = async () => {
      const txt = document.getElementById('copyText').value;
      try { await navigator.clipboard.writeText(txt); toast('✅ Đã copy vào clipboard'); }
      catch (e) {
        const ta = document.getElementById('copyText'); ta.select(); document.execCommand('copy'); toast('✅ Đã copy');
      }
      document.getElementById('copyModal').classList.remove('show');
    };
    document.getElementById('clearComments').onclick = () => {
      if (Object.keys(comments).length === 0) { toast('Không có gì để xoá'); return; }
      if (confirm('Xoá toàn bộ comment đang lưu trong trình duyệt?')) {
        comments = {}; saveComments(); openEditors.clear(); render(); toast('Đã xoá hết comment');
      }
    };

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // ---- Excel export (SheetJS nạp lazy) ----
    function withXLSX(cb) {
      if (window.XLSX) return cb();
      const s = document.createElement('script');
      s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
      s.onload = cb;
      s.onerror = () => toast('⚠️ Cần mạng để tải thư viện Excel');
      document.head.appendChild(s);
    }
    function exportXlsx() {
      withXLSX(() => {
        const rows = filtered.flatMap(tc => tc.steps.map(s => ({
          ID: displayId(tc), Checklist: tc.checklist || '', Ref: fmtRef(tc.ref), Title: tc.title,
          Category: tc.category, 'Sub-Category': tc.subcategory, Priority: tc.priority, Auto: tc.auto,
          Description: tc.description, Preconditions: tc.preconditions || '',
          'Step No': s.step, Action: s.action, Expected: s.expected, 'Test Data': s.testData || '',
          Comment: comments[commentKey(tc)] || '',
        })));
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Test Cases');
        XLSX.writeFile(wb, `testcases-${FEATURE}.xlsx`);
      });
    }
    function exportXlsxMerged() {
      withXLSX(() => {
        const headers = ['ID','Checklist','Ref','Title','Category','Sub-Category','Priority','Auto','Description','Preconditions','Step No','Action','Expected','Test Data','Comment'];
        const data = [headers]; const merges = []; let rowIdx = 1;
        filtered.forEach(tc => {
          const id = displayId(tc);
          const steps = tc.steps.length ? tc.steps : [{step:'',action:'',expected:'',testData:''}];
          const cmt = comments[commentKey(tc)] || '';
          steps.forEach((s, idx) => {
            data.push([
              idx===0?id:'', idx===0?(tc.checklist||''):'', idx===0?fmtRef(tc.ref):'', idx===0?tc.title:'',
              idx===0?tc.category:'', idx===0?tc.subcategory:'', idx===0?tc.priority:'', idx===0?tc.auto:'',
              idx===0?tc.description:'', idx===0?(tc.preconditions||''):'',
              s.step, s.action, s.expected, s.testData||'', idx===0?cmt:'',
            ]);
          });
          if (steps.length > 1) for (let c=0;c<10;c++) merges.push({ s:{r:rowIdx,c}, e:{r:rowIdx+steps.length-1,c} });
          if (steps.length > 1) merges.push({ s:{r:rowIdx,c:14}, e:{r:rowIdx+steps.length-1,c:14} });
          rowIdx += steps.length;
        });
        const ws = XLSX.utils.aoa_to_sheet(data); ws['!merges'] = merges;
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Test Cases');
        XLSX.writeFile(wb, `testcases-${FEATURE}-merged.xlsx`);
      });
    }

    // ---- Wire up ----
    ['search','filterFile','filterCategory','filterPriority','filterAuto','filterComment'].forEach(id => {
      document.getElementById(id).addEventListener('input', applyFilters);
      document.getElementById(id).addEventListener('change', applyFilters);
    });
    document.getElementById('pageSize').addEventListener('change', e => { pageSize = parseInt(e.target.value); currentPage = 1; render(); });
    document.getElementById('idPrefix').addEventListener('input', e => { idPrefix = e.target.value; render(); });
    document.getElementById('prefixToggle').addEventListener('change', e => { usePrefix = e.target.checked; render(); });
    document.getElementById('exportXlsx').addEventListener('click', exportXlsx);
    document.getElementById('exportXlsxMerged').addEventListener('click', exportXlsxMerged);
    document.querySelectorAll('#viewSeg button').forEach(b => b.addEventListener('click', () => {
      view = b.getAttribute('data-view');
      localStorage.setItem('tc-view', view);
      render();
    }));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('copyModal').classList.remove('show'); });

    render();
  </script>
</body>
</html>
